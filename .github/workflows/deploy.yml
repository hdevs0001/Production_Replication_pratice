name: Production Replication

on:
  workflow_dispatch:

jobs:
  test-ssh:
    runs-on: ubuntu-latest

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.VM_TAILSCALE_IP }}
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key

          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Test SSH connection
        env:
          SSH_HOST: ${{ secrets.VM_TAILSCALE_IP }}
          SSH_USER: ${{ secrets.VM_USER }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            "$SSH_USER@$SSH_HOST" \
            "echo 'SSH connection successful'; whoami; hostname; docker --version"

      - name: Pull latest code
        env:
          SSH_HOST: ${{ secrets.VM_TAILSCALE_IP }}
          SSH_USER: ${{ secrets.VM_USER }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            "$SSH_USER@$SSH_HOST" \
            "cd /home/harman/proud-rep && git pull origin main"

      - name: Check Docker
        env:
          SSH_HOST: ${{ secrets.VM_TAILSCALE_IP }}
          SSH_USER: ${{ secrets.VM_USER }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            "$SSH_USER@$SSH_HOST" \
            "docker --version && docker compose version"